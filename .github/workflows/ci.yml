name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            room-server/package-lock.json
            leaderboard-server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix room-server
      - run: npm ci --prefix leaderboard-server
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
