name: Bug report
description: A part of the game or the servers does not work correctly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you did, what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps that cause the problem
      placeholder: |
        1. npm run host
        2. Open the friend link on a phone
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How were you playing?
      options:
        - Hosted multiplayer (npm run host)
        - Offline practice (?offline=1)
        - Development (npm run dev)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Your operating system, browser, Node version and SpacetimeDB CLI version (`spacetime --version`).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Errors from the browser console, output from `npm run host` in the terminal, or screenshots.
